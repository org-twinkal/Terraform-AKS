kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: ingress-chatapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/org-twinkal/Terraform-AKS.git
    targetRevision: main
    path: chatapp-gitops/ingress

  destination:
    server: https://twinkalaks-3kan2abl.hcp.eastus.azmk8s.io:443
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true