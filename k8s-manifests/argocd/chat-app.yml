kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: chat-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/org-twinkal/Fullstack-chat-app.git
    targetRevision: main
    path: chatapp-gitops

  destination:
    server: https://twinkalaks-3kan2abl.hcp.eastus.azmk8s.io:443
    namespace: chatapp
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true